plugins {
    id 'java-library'
}

// 通用配置见根 build.gradle（toolchain 21 / UTF-8）

dependencies {
    // 图片
    implementation 'org.apache.pdfbox:pdfbox:3.0.5'          // pdf/ai

    // 文本/数据 (JSON/YAML/XML/CSV)
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.1'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.17.1'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml:2.17.1'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-csv:2.17.1'
    implementation 'com.ibm.icu:icu4j:75.1'                   // 编码检测

    // 归档
    implementation 'org.apache.commons:commons-compress:1.26.1'
    implementation 'org.tukaani:xz:1.9'
    runtimeOnly 'org.xerial.snappy:snappy-java:1.1.10.5'

    // Office (POI 5.3.0)
    implementation 'org.apache.poi:poi-ooxml:5.3.0'
    implementation 'org.apache.poi:poi:5.3.0'
    implementation 'org.apache.poi:ooxml-schemas:1.4'
    implementation 'org.apache.xmlbeans:xmlbeans:3.1.0'
    implementation 'org.apache.commons:commons-collections4:4.4'
    implementation 'org.apache.commons:commons-math3:3.6.1'
    implementation 'com.github.virtuald:curvesapi:1.07'
    runtimeOnly 'org.apache.logging.log4j:log4j-api:2.23.1'
    runtimeOnly 'org.apache.logging.log4j:log4j-core:2.23.1'

    // 音视频 (JavaCV + FFmpeg)
    implementation 'org.bytedeco:javacv:1.5.10'
    implementation 'org.bytedeco:ffmpeg:6.1.1-1.5.10'
    runtimeOnly 'org.bytedeco:ffmpeg:6.1.1-1.5.10:windows-x86_64'
}

testing {
    suites {
        named('test', JvmTestSuite) {
            useJUnitJupiter('5.10.2')
        }
    }
}

// 冒烟测试（main 式，javac 直编也能跑）
tasks.register('smokeTest', JavaExec) {
    group = 'verification'
    description = '运行 CoreSmokeTest（40 项功能冒烟测试）'
    dependsOn compileTestJava
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.fileforge.core.CoreSmokeTest'
    workingDir = projectDir.parentFile
}

tasks.named('check') {
    dependsOn 'smokeTest'
}