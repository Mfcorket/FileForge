name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build + smoke test
        run: ./gradlew :core:build :core:smokeTest

      - name: Desktop build
        run: ./gradlew :desktop:build

      - name: Package native app (Windows)
        if: runner.os == 'Windows'
        run: ./gradlew :desktop:jpackage

      - name: Upload distribution (Linux/macOS)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: fileforge-dist-${{ matrix.os }}
          path: desktop/build/distributions/*

      - name: Upload native app (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: fileforge-app-${{ matrix.os }}
          path: desktop/build/dist/**